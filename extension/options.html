<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>tsayru — settings</title>
  <style>
    body {
      font: 14px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: #1d1d22;
      max-width: 480px;
      margin: 24px auto;
      padding: 0 16px;
    }
    h1 { font-size: 18px; }
    label { display: block; margin: 14px 0 4px; font-weight: 600; }
    input {
      width: 100%;
      box-sizing: border-box;
      padding: 7px 10px;
      border: 1px solid #c9c9d4;
      border-radius: 6px;
      font: inherit;
    }
    button {
      margin-top: 16px;
      padding: 7px 18px;
      border: none;
      border-radius: 6px;
      background: #6466fa;
      color: #fff;
      font: inherit;
      cursor: pointer;
    }
    button:hover { background: #5254e8; }
    #status { margin-left: 10px; color: #2e7d4f; }
    .hint { color: #6b6b76; font-size: 12.5px; margin-top: 18px; }
    code { background: #f0f0f5; border-radius: 4px; padding: 1px 5px; }
  </style>
</head>
<body>
  <h1>tsayru — advanced settings</h1>

  <label for="serverUrl">Inbox server URL</label>
  <input id="serverUrl" type="url" placeholder="http://127.0.0.1:7777" />

  <label for="token">Access token</label>
  <input id="token" type="text" placeholder="leave empty for local use" autocomplete="off" />

  <button id="save">Save</button><span id="status"></span>

  <p class="hint">
    Defaults talk to the local <code>tsayru-server</code> on
    <code>127.0.0.1:7777</code> — nothing to configure for solo use.
    For <strong>team mode</strong>, point the URL at a shared server started with
    <code>TSAYRU_BIND=0.0.0.0 TSAYRU_TOKEN=&lt;secret&gt;</code> and paste the
    same token here.
  </p>

  <script src="options.js"></script>
</body>
</html>
