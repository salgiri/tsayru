<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>tsayru settings</title>
  <style>
    @font-face {
      font-family: "tsayru Onest";
      src: url(fonts/onest-latin.woff2) format("woff2");
      font-weight: 100 900;
      unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
    }
    @font-face {
      font-family: "tsayru Onest";
      src: url(fonts/onest-cyrillic.woff2) format("woff2");
      font-weight: 100 900;
      unicode-range: U+0301, U+0400-045F, U+0490-0491, U+04B0-04B1, U+2116;
    }

    /* A subset of src/theme-css.js — the source of truth for these values. */
    :root {
      --font: "tsayru Onest", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
      --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
      --shell: #e2e2df;
      --key: #f5f4f2;
      --well: #d6d6d2;
      --field-line: #7b7a76;
      --ink: #000;
      --text-2: #5b5b57;
      --signal: #0524fe;
      --marker-text: #a61b86;
      --shadow-key: 0 0 0 1px oklch(0 0 0 / 0.06), 0 1px 2px -1px oklch(0 0 0 / 0.06), 0 2px 4px 0 oklch(0 0 0 / 0.04);
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --shell: #1d1e20;
        --key: #2a2b2e;
        --well: #141517;
        --field-line: #787a7f;
        --ink: #f4f3f0;
        --text-2: #afb1b6;
        --signal: #1746ff;
        --marker-text: #ffa1d7;
        --shadow-key: 0 0 0 1px oklch(1 0 0 / 0.08);
      }
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 20px;
      background: var(--shell);
      color: var(--ink);
      font: 14px/1.45 var(--font);
      -webkit-font-smoothing: antialiased;
      min-width: 360px;
    }
    main { max-width: 480px; margin: 0 auto; }
    header { display: flex; align-items: center; gap: 10px; margin-bottom: 18px; }
    .mark { width: 30px; height: 30px; border-radius: 9px; overflow: hidden; background: var(--signal); flex: none; }
    .mark svg { display: block; width: 100%; height: 100%; }
    h1 { margin: 0; font-size: 21px; font-weight: 800; letter-spacing: -0.04em; }
    h1 span { font-weight: 600; letter-spacing: -0.015em; color: var(--text-2); }
    label { display: block; margin: 16px 0 6px 4px; font-weight: 650; font-size: 14px; }
    input {
      width: 100%;
      height: 48px;
      padding: 0 14px;
      border: 1px solid var(--field-line);
      border-radius: 16px;
      background: var(--well);
      color: var(--ink);
      font: 16px var(--font);
      outline: none;
      transition: border-color 150ms ease-out, box-shadow 150ms ease-out;
    }
    input::placeholder { color: var(--text-2); }
    input:focus { border-color: var(--signal); box-shadow: 0 0 0 1px var(--signal); }
    .row { display: flex; align-items: center; gap: 12px; margin-top: 18px; }
    button {
      height: 52px;
      padding: 0 24px;
      border: 0;
      border-radius: 18px;
      background: var(--signal);
      color: #fff;
      font: 650 15.5px var(--font);
      letter-spacing: -0.01em;
      cursor: pointer;
      box-shadow: inset 0 1px 0 rgb(255 255 255 / 0.22);
      transition: scale 150ms ease-out;
    }
    button:active { scale: 0.96; }
    @media (prefers-reduced-motion: reduce) { button:active { scale: none; } }
    button:focus-visible { outline: 2.5px solid var(--ink); outline-offset: 2px; }
    #status { font-weight: 600; color: var(--text-2); }
    #status.bad { color: var(--marker-text); }
    .hint {
      margin-top: 22px;
      padding: 14px 16px;
      border-radius: 18px;
      background: var(--key);
      box-shadow: var(--shadow-key);
      color: var(--text-2);
      font-size: 13.5px;
    }
    .hint p { margin: 0; }
    .hint p + p { margin-top: 8px; }
    .hint strong { color: var(--ink); }
    code { font: 12.5px var(--mono); color: var(--ink); }
  </style>
</head>
<body>
  <main>
    <header>
      <div class="mark">
        <svg viewBox="0 0 1000 1000" aria-hidden="true"><path fill="#fad620" d="M1157 -71.5 543.6 537.9 535.5 546c-67.5 67.5-67.5 176.9 0 244.4l8.1 8.1-81.5 81.5-8.1-8.1c-67.5-67.5-176.9-67.5-244.4 0l-8.1 8.1-81.5-81.5 8.1-8.1c67.5-67.5 67.5-176.9 0-244.4l-8.1-8.1 81.5-81.5 8.1 8.1c67.5 67.5 176.9 67.5 244.4 0l8.1-8.1L1075.5 -153z"/></svg>
      </div>
      <h1>tsayru <span>settings</span></h1>
    </header>

    <label for="serverUrl">Inbox server URL</label>
    <input id="serverUrl" type="url" placeholder="http://127.0.0.1:7777" />

    <label for="token">Access token</label>
    <input id="token" type="text" placeholder="Leave empty for local use" autocomplete="off" />

    <div class="row"><button id="save">Save settings</button><span id="status" role="status"></span></div>

    <div class="hint">
      <p>Out of the box tsayru talks to the local <code>tsayru-server</code> on <code>127.0.0.1:7777</code>. Nothing to set up when you work alone.</p>
      <p><strong>Team mode:</strong> start a shared server with <code>TSAYRU_BIND=0.0.0.0 TSAYRU_TOKEN=&lt;secret&gt;</code>, put its URL above and paste the same token.</p>
    </div>
  </main>

  <script src="options.js"></script>
</body>
</html>
