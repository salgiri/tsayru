name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      # extension/content.js is committed build output — fail if it drifted
      # from src/ (i.e. someone edited src/ without rebuilding, or vice versa).
      - name: Check bundle is up to date
        run: git diff --exit-code extension/content.js
      - run: npm test
